name: Import source into CineVoz

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CineVoz
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check out authorized source snapshot
        uses: actions/checkout@v4
        with:
          repository: themithology/Fumio
          ref: bdf6f17c235c62781f091d2d4caa8069076cf526
          path: source
      - name: Copy source and apply CineVoz baseline
        shell: bash
        run: |
          rsync -a --exclude='.git/' --exclude='.github/workflows/' --exclude='android/app/fumio-release.p12' source/ ./
          rm -f android/app/fumio-release.p12
          rm -rf source
          python3 - <<'PY'
          import json, pathlib, re
          p = pathlib.Path("package.json")
          d = json.loads(p.read_text())
          d["name"] = "cinevoz"
          d["description"] = "CineVoz — media browsing and playback app."
          p.write_text(json.dumps(d, indent=2) + "\n")
          p = pathlib.Path("package-lock.json")
          if p.exists():
              s = p.read_text().replace('"theogpiratebot"', '"cinevoz"')
              p.write_text(s)
          p = pathlib.Path("index.html")
          s = p.read_text().replace("TheOGPirateBot", "CineVoz")
          s = s.replace("movies, TV and anime. Details + Player.", "movies, series and media playback.")
          p.write_text(s)
          p = pathlib.Path("capacitor.config.json")
          d = json.loads(p.read_text())
          d["appId"] = "com.cinevoz.app"
          d["appName"] = "CineVoz"
          d["server"]["allowNavigation"] = []
          p.write_text(json.dumps(d, indent=2) + "\n")
          p = pathlib.Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace('applicationId "com.fumio.app"', 'applicationId "com.cinevoz.app"')
          s = re.sub(r'    /\*\s*\n     \* ONE key, forever\.[\s\S]*?\n    signingConfigs \{\n        release \{[\s\S]*?\n        \}\n    \}\n', '', s)
          s = re.sub(r'^\s*signingConfig signingConfigs\.release\s*\n', '', s, flags=re.M)
          p.write_text(s)
          p = pathlib.Path("android/app/src/main/res/values/strings.xml")
          s = p.read_text().replace("TheOGPirateBot", "CineVoz").replace("com.fumio.app", "com.cinevoz.app")
          p.write_text(s)
          readme = "# CineVoz\n\nCineVoz is a web and Android media application built with React, Vite and Capacitor.\n\n## Project structure\n- `src/` — React application and UI\n- `public/` — web assets\n- `android/` — native Android application\n- `worker/` — optional backend worker\n- `docs/` — project documentation\n\n## Development\n```bash\nnpm install\nnpm run dev\nnpm run build\nnpx cap sync android\n```\n\nOpen the `android/` folder in Android Studio to build the Android app.\n\n## Android identity\n- Display name: CineVoz\n- Application ID: `com.cinevoz.app`\n\n## Security and content\nThe original repository's signing keystore was intentionally excluded. Create and protect your own release signing key. Never commit private keystores, passwords, API tokens or production credentials.\n\nReview third-party services and content-provider integrations before enabling them in a public release. Only use media that you own, are licensed to distribute, or that is in the public domain.\n"
          pathlib.Path("README.md").write_text(readme)
          PY
          if grep -RIl --exclude-dir=.git 'fumioTv2026' . | xargs -r sed -i 's/fumioTv2026/[removed]/g'; then
            echo "Removed upstream signing password references."
          fi
          git config user.name "CineVoz Import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import source as CineVoz; remove upstream signing key"
          git push origin HEAD:main
